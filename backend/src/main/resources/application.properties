# Server Configuration
server.port=8080
spring.application.name=hiver-support-agent

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/hiver_support?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# LLM API Configuration (OpenAI - can be changed to other providers)
# LLM Configuration
llm.api.provider=gemini
llm.api.key=${GEMINI_API_KEY}
llm.api.model=gemini-3.5-flash
llm.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent

# Application Configuration
app.brand.name=AmazonSupport
app.data.sample.size=10000
app.intents=technical_issue,billing_question,shipping_delay,product_inquiry,complaint,general_inquiry,account_issue
app.auto-handle.threshold=0.7

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# CORS Configuration
cors.allowed.origins=http://localhost:3000,http://localhost:5273